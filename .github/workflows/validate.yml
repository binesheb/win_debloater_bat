name: Validate batch utility

on:
  push:
    branches: [main]
    paths:
      - '**/*.bat'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.bat'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

concurrency:
  group: validate-batch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate batch structure without executing removals
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Recurse -File -Filter *.bat
          if (-not $scripts) {
            throw 'No batch scripts found.'
          }

          foreach ($script in $scripts) {
            $content = Get-Content -Raw -LiteralPath $script.FullName
            if ($content -notmatch '(?m)^@echo off') {
              throw "Missing @echo off in $($script.FullName)"
            }
            if ($content -notmatch '(?m)^setlocal\b') {
              throw "Missing setlocal in $($script.FullName)"
            }
            if ($content -notmatch '(?m)^endlocal\b') {
              throw "Missing endlocal in $($script.FullName)"
            }

            $names = [regex]::Matches($content, '(?m)^set "app_name\[(\d+)\]=([^\r\n"]+)"$')
            $ids = [regex]::Matches($content, '(?m)^set "app_id\[(\d+)\]=([^\r\n"]+)"$')
            if (-not $names) {
              throw "No application menu entries found in $($script.FullName)"
            }
            if (-not $ids) {
              throw "No explicit Appx package identifiers found in $($script.FullName)"
            }
            if ($names.Count -ne $ids.Count) {
              throw "app_name entries ($($names.Count)) do not match app_id entries ($($ids.Count)) in $($script.FullName)"
            }

            $nameIndexes = @($names | ForEach-Object { [int]$_.Groups[1].Value } | Sort-Object)
            $idIndexes = @($ids | ForEach-Object { [int]$_.Groups[1].Value } | Sort-Object)
            for ($i = 0; $i -lt $names.Count; $i++) {
              if ($nameIndexes[$i] -ne $i -or $idIndexes[$i] -ne $i) {
                throw "Menu indexes must be contiguous and start at zero in $($script.FullName)"
              }
            }

            $seenIds = @{}
            foreach ($match in $ids) {
              $packageId = $match.Groups[2].Value
              if ($packageId -notmatch '^[A-Za-z0-9.]+$') {
                throw "Malformed Appx package identifier '$packageId' in $($script.FullName)"
              }
              if ($seenIds.ContainsKey($packageId)) {
                throw "Duplicate Appx package identifier '$packageId' in $($script.FullName)"
              }
              $seenIds[$packageId] = $true
            }

            $seenNames = @{}
            foreach ($match in $names) {
              $displayName = $match.Groups[2].Value
              if ($seenNames.ContainsKey($displayName)) {
                throw "Duplicate application menu name '$displayName' in $($script.FullName)"
              }
              $seenNames[$displayName] = $true
            }

            if ($content -match '(?m)^set /a app_count=(\d+)$') {
              $declaredCount = [int]$Matches[1]
              if ($declaredCount -ne $ids.Count) {
                throw "app_count ($declaredCount) does not match the number of app_id entries ($($ids.Count)) in $($script.FullName)"
              }
            } else {
              throw "Missing app_count declaration in $($script.FullName)"
            }

            # Keep the cleanup scope intentionally limited to the current user's
            # explicitly selected packages. Broader removal mechanisms are outside
            # this utility's documented safety boundary.
            if ($content -match '(?i)-AllUsers|Remove-AppxProvisionedPackage|Remove-AppxPackage\s+-Package') {
              throw "Unsafe broad Appx removal command detected in $($script.FullName)"
            }
          }
